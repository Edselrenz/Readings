        // 2. Initialize or load existing progress from localStorage
        let progressData = JSON.parse(localStorage.getItem('pangtestingProgress')) || {};

        // 3. Save progress back to localStorage
        function saveProgress() {
            localStorage.setItem('pangtestingProgress', JSON.stringify(progressData));
        }

        // 4. Toggle Read/Unread status
        function toggleRead(id) {
            if (!progressData[id]) progressData[id] = { read: false, bookmarked: false };
            progressData[id].read = !progressData[id].read;
            saveProgress();
            renderList();
        }

        // 5. Toggle Bookmark status
        function toggleBookmark(id) {
            if (!progressData[id]) progressData[id] = { read: false, bookmarked: false };
            progressData[id].bookmarked = !progressData[id].bookmarked;
            saveProgress();
            renderList();
        }

        // 6. Handle Page Changes
        function changePage(page) {
            currentPage = page;
            renderList();
        }

        // 7. Render the user interface for the list
        function renderList() {
            const listContainer = document.getElementById('fileList');
            listContainer.innerHTML = ''; // Clear existing list

            // Calculate pagination slices
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentFiles = filesToTrack.slice(startIndex, endIndex);

            currentFiles.forEach(file => {
                const fileData = progressData[file.id] || { read: false, bookmarked: false };
                
                const li = document.createElement('li');
                li.className = `file-item ${fileData.read ? 'read' : ''} ${fileData.bookmarked ? 'bookmarked' : ''}`;
                
                li.innerHTML = `
                    <div class="file-info">
                        <a href="${file.path}" class="file-name" target="_blank">
                            <span class="bookmark-icon">★</span>${file.title}
                        </a>
                    </div>
                    <div class="actions">
                        <button class="btn-bookmark" onclick="toggleBookmark('${file.id}')">
                            ${fileData.bookmarked ? 'Remove Bookmark' : 'Bookmark'}
                        </button>
                        <button class="btn-read" onclick="toggleRead('${file.id}')">
                            ${fileData.read ? 'Mark as Unread' : 'Mark as Read'}
                        </button>
                    </div>
                `;
                listContainer.appendChild(li);
            });

            renderPagination();
        }

        // 8. Render the pagination controls
        function renderPagination() {
            const paginationContainer = document.getElementById('paginationControls');
            paginationContainer.innerHTML = '';
            
            const totalPages = Math.ceil(filesToTrack.length / itemsPerPage);
            
            // Previous Button
            const prevBtn = document.createElement('button');
            prevBtn.innerText = 'Previous';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => changePage(currentPage - 1);
            paginationContainer.appendChild(prevBtn);

            // Page Numbers
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.innerText = i;
                if (i === currentPage) pageBtn.className = 'active';
                pageBtn.onclick = () => changePage(i);
                paginationContainer.appendChild(pageBtn);
            }

            // Next Button
            const nextBtn = document.createElement('button');
            nextBtn.innerText = 'Next';
            nextBtn.disabled = currentPage === totalPages || totalPages === 0;
            nextBtn.onclick = () => changePage(currentPage + 1);
            paginationContainer.appendChild(nextBtn);
        }

        // Initial render when the page loads
        renderList();
